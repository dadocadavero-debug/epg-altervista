name: Aggiorna EPG + Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: epg-playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera EPG e playlist insieme
        run: python update_epg.py

      - name: Verifica output
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          epg = Path("epg.xml")
          m3u = Path("tv_epg.m3u")

          if not epg.exists() or not m3u.exists():
              raise SystemExit("Mancano epg.xml o tv_epg.m3u")

          root = ET.parse(epg).getroot()
          epg_ids = {
              (p.get("channel") or "").strip()
              for p in root.findall("programme")
              if (p.get("channel") or "").strip()
          }

          text = m3u.read_text(encoding="utf-8", errors="strict")
          if not text.startswith("#EXTM3U "):
              raise SystemExit("Header M3U non valido")

          extinf = [x for x in text.splitlines() if x.startswith("#EXTINF")]
          if len(extinf) < 50:
              raise SystemExit(f"Playlist troppo piccola: {len(extinf)} canali")

          print(f"OK: {len(extinf)} canali; {len(epg_ids)} ID EPG con programmi")
          PY

      - name: Commit atomico EPG + playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml tv_epg.m3u epg_report.txt mapping_report.txt

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git commit -m "Aggiorna EPG e playlist sincronizzati"
          git push
