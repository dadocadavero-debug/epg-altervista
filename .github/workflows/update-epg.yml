name: Aggiorna EPG Altervista

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sincronizza repository
        run: |
          git pull --rebase origin main

      - name: Genera EPG
        run: python update_epg.py

      - name: Salva EPG aggiornato
        run: |
          git config user.name "EPG Bot"
          git config user.email "actions@github.com"

          git add epg.xml

          if git diff --cached --quiet; then
            echo "Nessuna modifica EPG da salvare"
            exit 0
          fi

          git commit -m "Aggiornamento automatico EPG"
          git pull --rebase origin main
          git push origin HEAD:main
