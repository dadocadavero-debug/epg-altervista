name: Aggiorna playlist Altervista EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronizza repository
        run: git pull --rebase origin main

      - name: Genera playlist aggiornata
        run: python update_playlist.py

      - name: Pubblica se cambia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tv_epg.m3u mapping_report.txt

          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi

          git commit -m "Aggiorna playlist Altervista con EPG"
          git pull --rebase origin main
          git push origin HEAD:main
